permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional PDF and signing dependencies
        run: python -m pip install -r requirements-pdf.txt -r requirements-crypto.txt
      - name: Compile source and tests
        run: python -m compileall -q apex_storage.py apex_execution.py apex_doctor.py apex_recon_v2.py apex_web.py apex_tls.py apex_fingerprint.py apex_evidence.py apex_findings.py apex_finding_adapters.py apex_engagement.py apex_engagement_cli.py apex_signing.py apex_audit.py apex_audit_backup.py apex_audit_backup_signing.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  linux-dependency-smoke:
    name: Linux dependency smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap whois dnsutils curl iproute2
      - name: Verify dependency detection and safe startup imports
        run: |
          python apex_doctor.py --json > /dev/null
          python -c "import apex_doctor; import apex_execution; import apex_recon_v2 as apex; import apex_web; import apex_tls; import apex_fingerprint; import apex_evidence; import apex_findings; import apex_finding_adapters; import apex_engagement; import apex_engagement_cli; import apex_signing; import apex_audit; import apex_audit_backup; import apex_audit_backup_signing; assert apex.check_deps(), 'runtime dependencies missing'; assert apex.validate_osint_target('example.com'); assert apex.validate_network_target('192.0.2.0/24'); assert apex_web.normalize_target_url('example.com').scheme == 'https'"
