name: ApexRecon validation

on:
  push:
    branches:
      - main
      - r1-source-recovery-stabilization
      - r1-phase1-validation
      - phase2-http-assessment
      - phase2b-http-cli-report
      - phase2c-tls-assessment
      - phase2d-cms-technology-fingerprinting
      - phase2e-professional-evidence-reporting
      - phase2f-evidence-reliability
      - phase2g-cross-module-findings
      - phase2h-smb-osint-findings
  pull_request:
    branches:
      - main
      - r1-source-recovery-stabilization
      - r1-phase1-validation
      - phase2-http-assessment
      - phase2b-http-cli-report
      - phase2c-tls-assessment
      - phase2d-cms-technology-fingerprinting
      - phase2e-professional-evidence-reporting
      - phase2f-evidence-reliability
      - phase2g-cross-module-findings

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional native PDF dependency
        run: python -m pip install -r requirements-pdf.txt
      - name: Compile source and tests
        run: python -m compileall -q apex_recon_v2.py apex_web.py apex_tls.py apex_fingerprint.py apex_evidence.py apex_findings.py apex_finding_adapters.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  linux-dependency-smoke:
    name: Linux dependency smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap whois dnsutils curl
      - name: Verify dependency detection and safe startup imports
        run: |
          python -c "import apex_recon_v2 as apex; import apex_web; import apex_tls; import apex_fingerprint; import apex_evidence; import apex_findings; import apex_finding_adapters; assert apex.check_deps(), 'runtime dependencies missing'; assert apex.validate_osint_target('example.com'); assert apex.validate_network_target('192.0.2.0/24'); assert apex_web.normalize_target_url('example.com').scheme == 'https'"
